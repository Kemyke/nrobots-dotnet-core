version: '1.0.{build}'
image: Visual Studio 2022
configuration:
- Debug
- Release
platform: Any CPU
environment:
  # Don't report back to the mothership
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
init:
- ps: $Env:LABEL = "CI" + $Env:APPVEYOR_BUILD_NUMBER.PadLeft(5, "0")
install:
# The SDK pinned in global.json may be newer than the one on the image
- ps: Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
- ps: ./dotnet-install.ps1 -JsonFile global.json -InstallDir "$Env:ProgramFiles\dotnet"
before_build:
- appveyor-retry dotnet restore Robots.slnx -v Minimal
build_script:
- dotnet build Robots.slnx -c %CONFIGURATION% --no-restore --version-suffix %LABEL%
after_build:
- dotnet pack Robots/Robots.csproj -c %CONFIGURATION% --no-build --version-suffix %LABEL% -o artifacts
test_script:
- dotnet test --solution Robots.slnx -c %CONFIGURATION% --no-build
artifacts:
- path: artifacts\**\*.*
cache:
- '%USERPROFILE%\.nuget\packages'
